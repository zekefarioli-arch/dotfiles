# Catppuccin Mocha Pink (copy in dotfiles: system/etc/lightdm/lightdm-gtk-greeter.conf)
# Install: sudo cp this-file /etc/lightdm/  (needs the theme, icons and cursor
# copied to /usr/share/themes and /usr/share/icons, see scripts/install-themes.sh)
[greeter]
background=#1e1e2e
user-background=false
theme-name=Catppuccin-Pink-Dark
icon-theme-name=Papirus-Dark
cursor-theme-name=catppuccin-mocha-pink-cursors
cursor-theme-size=24
font-name=Noto Sans 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
indicators=~host;~spacer;~clock;~spacer;~layout;~session;~power
clock-format=%a %d %b   %H:%M
position=50%,center 50%,center
round-user-image=true
default-user-image=#avatar-default
