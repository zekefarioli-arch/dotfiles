# Shutdown from the login screen waited 30 s with nothing happening.
# Install: sudo install -D -m 644 this-file /etc/systemd/logind.conf.d/zz-inhibit-delay.conf
# (takes effect at the next boot; `systemctl restart systemd-logind` would also do it, but it
# can disturb a graphical session).
# Why: libvirtd holds a "shutdown" delay inhibitor while a VM runs (the CI VM) and releases it
# only when the VM stops, but libvirt-guests, which stops the VM, starts only after logind has
# stopped waiting. So logind always waited the full InhibitDelayMaxSec, and
# unattended-upgrades raises that to 30 s (/usr/lib/systemd/logind.conf.d/unattended-upgrades-logind-maxdelay.conf).
# The "zz-" name sorts after that file, so this value wins (5 s is systemd's own default).
# Rejected: ON_SHUTDOWN=suspend in libvirt-guests (saves the VM to disk, slower, the runner
# would have to reconnect); removing the unattended-upgrades file (a package update restores it).
# Cost: an upgrade running at the very moment of the shutdown gets 5 s to finish, not 30.
[Login]
InhibitDelayMaxSec=5
