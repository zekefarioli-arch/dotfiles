# ~/.tmux.conf — Catppuccin Mocha

# Colors and keys (Shift+Enter, Ctrl+Enter, etc. reach apps such as Claude Code)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:extkeys,alacritty*:RGB:extkeys"
set -s extended-keys on
set -s escape-time 10
set -g focus-events on

# Behavior
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status bar
set -g status-position bottom
set -g status-style "bg=#11111b,fg=#cdd6f4"
set -g status-left "#[bg=#f5c2e7,fg=#11111b,bold] #S #[default] "
set -g status-left-length 20
set -g status-right "#[fg=#6c7086]%H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#89b4fa,fg=#11111b,bold] #I #W #[default]"

# Panes and messages
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#f5c2e7"
set -g message-style "bg=#313244,fg=#cdd6f4"

# Copy: releasing the mouse after a selection sends the text to the clipboard
# (xclip; terminator has no OSC 52 support). Paste: Ctrl+Shift+V.
# Shift + drag uses terminator's own selection.
set -s set-clipboard off
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode    C-c               send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Modified keys (Ctrl/Shift+Enter, etc.) in CSI u format, which Claude Code
# understands. Needs a terminal that sends them (wezterm does, terminator does not).
set -s extended-keys always
set -s extended-keys-format csi-u

# Sessions that survive reboots:
# - tmux-resurrect saves/restores sessions, windows, panes and directories
# - tmux-continuum saves every 5 minutes and restores when tmux starts
# Claude Code is reopened with --continue (resumes the last conversation).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes '"~claude->claude --continue"'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

# Install TPM and the plugins on first run
if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
