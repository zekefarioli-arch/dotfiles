# ~/.tmux.conf — Catppuccin Mocha

# Colores y teclas (Shift+Enter, Ctrl+Enter, etc. llegan a las apps, p. ej. Claude Code)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:extkeys"
set -s extended-keys on
set -s escape-time 10
set -g focus-events on

# Comportamiento
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Barra de estado
set -g status-position bottom
set -g status-style "bg=#11111b,fg=#cdd6f4"
set -g status-left "#[bg=#f5c2e7,fg=#11111b,bold] #S #[default] "
set -g status-left-length 20
set -g status-right "#[fg=#6c7086]%H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#89b4fa,fg=#11111b,bold] #I #W #[default]"

# Paneles y mensajes
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#f5c2e7"
set -g message-style "bg=#313244,fg=#cdd6f4"
