# ~/.config/alacritty/alacritty.toml — Catppuccin Mocha, pink accent

[general]
live_config_reload = true
# Per-machine overrides (font size...) go in local.toml, which is not in the repo. Alacritty loads
# imports first and this file last, so anything set in both places is won by THIS file: keep
# those keys (font size) out of it. A missing local.toml is skipped without an error.
import = ["~/.config/alacritty/local.toml"]

[window]
decorations = "None"              # xmonad draws the borders
padding = { x = 8, y = 6 }
dynamic_padding = true
opacity = 0.95                    # picom does the transparency

[font]
# size: set per machine in local.toml (11.0 on the ThinkPad, 8.5 on the Ryzen 9); default 11.25
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

[cursor]
style = { shape = "Beam", blinking = "Off" }

[selection]
save_to_clipboard = true

[scrolling]
history = 10000

# Send Shift/Ctrl+Enter as CSI u so they reach apps such as Claude Code as
# distinct keys, also through tmux (extended-keys in CSI u format).
[keyboard]
bindings = [
  { key = "Return", mods = "Shift", chars = "\u001b[13;2u" },
  { key = "Return", mods = "Control", chars = "\u001b[13;5u" },
]

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"
dim_foreground = "#7f849c"
bright_foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5c2e7"

[colors.vi_mode_cursor]
text = "#1e1e2e"
cursor = "#b4befe"

[colors.selection]
text = "#1e1e2e"
background = "#f5c2e7"

[colors.search.matches]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.search.focused_match]
foreground = "#1e1e2e"
background = "#a6e3a1"

[colors.hints.start]
foreground = "#1e1e2e"
background = "#f9e2af"

[colors.hints.end]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"
