# ~/.xmonad/keys.conf — shortcuts for the xmonad actions
#
# Format: action-name  shortcut  [shortcut]   (EZConfig syntax: M = Super,
# S = Shift, C = Ctrl, M1 = Alt, special keys in <>, e.g. M-S-<Return>).
# Every action and its description: ~/.cache/xmonad/actions.tsv
# An action missing here keeps its default shortcuts; an action listed
# without shortcuts has none. Apply changes with: xmonad --restart
# Edit it with the shortcut editor (Super+Shift+F1) or by hand.

# Help
show-shortcuts            M-<F1>  M-/  M-<XF86AudioMute>
edit-shortcuts            M-S-<F1>  M-S-/

# Apps
terminal                  M-<Return>  M-S-<Return>
dropdown-terminal         M-C-t
launcher                  M-r
run-command               M-p
file-manager              M-e
clipboard                 M-v

# Windows
close-window              M-w  M-S-c
window-switcher           M-<Tab>
window-list               M-t
focus-next                M-j
focus-previous            M-k  M-S-<Tab>
focus-master              M-m
swap-next                 M-S-j
swap-previous             M-S-k
swap-master
sink-window               M-S-t
refresh                   M-n

# Layouts
next-layout               M-<Space>  M-C-<Tab>
reset-layout              M-S-<Space>
full-layout               M-f
full-layout-no-bar        M-C-f
toggle-gaps
shrink-master             M-h
expand-master
more-master               M-,
fewer-master              M-.

# Workspaces
view-workspace-1          M-1
move-to-workspace-1       M-S-1
move-and-follow-1
view-workspace-2          M-2
move-to-workspace-2       M-S-2
move-and-follow-2
view-workspace-3          M-3
move-to-workspace-3       M-S-3
move-and-follow-3
view-workspace-4          M-4
move-to-workspace-4       M-S-4
move-and-follow-4
view-workspace-5          M-5
move-to-workspace-5       M-S-5
move-and-follow-5
view-workspace-6          M-6
move-to-workspace-6       M-S-6
move-and-follow-6
view-workspace-7          M-7
move-to-workspace-7       M-S-7
move-and-follow-7
view-workspace-8          M-8
move-to-workspace-8       M-S-8
move-and-follow-8
view-workspace-9          M-9
move-to-workspace-9       M-S-9
move-and-follow-9

# Monitors
focus-previous-monitor    M-S-,
focus-next-monitor        M-S-.
move-to-previous-monitor  M-C-,
move-to-next-monitor      M-C-.
focus-monitor-1
move-to-monitor-1         M-S-w
focus-monitor-2
move-to-monitor-2         M-S-e
focus-monitor-3
move-to-monitor-3         M-S-r

# Notifications
show-last-notification    M-S-n
close-notifications       M-C-n

# Bar
toggle-main-bar           M-b
toggle-secondary-bar      M-C-b
toggle-all-bars           M-S-b

# System
lock-screen               M-l
restart-xmonad            M-q
log-out                   M-C-q  M-S-q
screenshot                <Print>
magnifier                 M-C-m
close-magnifier           M-C-S-m

# Media
volume-up                 <XF86AudioRaiseVolume>
volume-down               <XF86AudioLowerVolume>
volume-mute               <XF86AudioMute>
brightness-up             <XF86MonBrightnessUp>
brightness-down           <XF86MonBrightnessDown>
