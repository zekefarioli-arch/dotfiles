# ~/.xmonad/actions.conf — custom actions that run a shell command
#
# Format (tab separated): category<TAB>name<TAB>description<TAB>command
# They appear in the shortcut editor (Super+Shift+F1) and the cheat sheet
# (Super+F1) like the built-in actions; give them shortcuts in keys.conf or
# with the editor. Add them with the editor ("+ New action") or by hand,
# then apply with: xmonad --restart
Utilities	google-calendar	Google Calendar web app, tiled (Ctrl+E: Claude panel)	~/.local/bin/google-calendar
Utilities	google-calendar-extensions	Google Calendar app: extensions, Claude and theme	~/.local/bin/google-calendar extensions
Utilities	webapp-extensions	Web apps: shared profile, extensions page and FireShot	~/.local/bin/webapp extensions
Utilities	claude-pick	Claude launcher: folder and session in rofi, with context usage	~/.local/bin/claude-pick
Utilities	connect-to-home-vpn	Connect to the VPN of the house, or disconnect it if already connected (WireGuard)	~/.local/bin/home-vpn

Utilities	find-a-job	Find a job: sign in to jobs.service.gov.uk (password and SMS code automatic)	~/.local/bin/findajob
