;==========================================================
;   MODULES
;==========================================================

[module/systray]
type = internal/tray
tray-spacing = 4pt
tray-maxsize = 18

; --- XMONAD: active monitor, workspaces, layout and window ---
; xmonad publishes each screen's text; launch-bars.sh sets SCREEN in the bar's environment and
; xmonad-log.sh reads it (polybar 3.7.2 on Arch passed ${env:SCREEN:0} to the shell unexpanded)
[module/xmonad]
type = custom/script
exec = ~/.config/polybar/xmonad-log.sh
tail = true
format = <label>
label = %output%

; -----------------------------------------


[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
label-mounted = %mountpoint% %percentage_used%%
label-mounted-foreground = ${colors.primary}
label-unmounted = not mounted
label-unmounted-foreground = ${colors.disabled}


[module/pulseaudio]
type = internal/pulseaudio

click-right = pavucontrol
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%

label-muted = "muted "
label-muted-foreground = ${colors.disabled}


[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = "%layout% "
label-layout-foreground = ${colors.primary}

; --- SPECIFIC CAPS LOCK CONFIGURATION ---
label-indicator-on-capslock = "󰘲 󰪛"
label-indicator-on-capslock-background = ${colors.secondary}
label-indicator-on-capslock-foreground = ${colors.background}
label-indicator-on-capslock-padding = 1
label-indicator-on-capslock-margin = 0

[module/memory]
type = internal/memory
interval = 2
; Same icon, Catppuccin colour by usage: green < 60%, peach 60-79%, red >= 80%
format = <ramp-used> <label>
label = %percentage_used:2%%
module-margin-left = 0
module-margin-right = 0
module-padding-right = 0
ramp-used-0 = 
ramp-used-0-foreground = ${colors.primary}
ramp-used-1 = 
ramp-used-1-foreground = ${colors.primary}
ramp-used-2 = 
ramp-used-2-foreground = ${colors.primary}
ramp-used-3 = 
ramp-used-3-foreground = ${colors.primary}
ramp-used-4 = 
ramp-used-4-foreground = ${colors.primary}
ramp-used-5 = 
ramp-used-5-foreground = ${colors.primary}
ramp-used-6 = 
ramp-used-6-foreground = #fab387
ramp-used-7 = 
ramp-used-7-foreground = #fab387
ramp-used-8 = 
ramp-used-8-foreground = ${colors.alert}
ramp-used-9 = 
ramp-used-9-foreground = ${colors.alert}


[module/cpu]
type = internal/cpu
interval = 2
; Same icon, Catppuccin colour by load: green < 50%, peach 50-79%, red >= 80%
format = <ramp-load> <label>
label = %percentage:2%%
ramp-load-0 = 
ramp-load-0-foreground = ${colors.primary}
ramp-load-1 = 
ramp-load-1-foreground = ${colors.primary}
ramp-load-2 = 
ramp-load-2-foreground = ${colors.primary}
ramp-load-3 = 
ramp-load-3-foreground = ${colors.primary}
ramp-load-4 = 
ramp-load-4-foreground = ${colors.primary}
ramp-load-5 = 
ramp-load-5-foreground = #fab387
ramp-load-6 = 
ramp-load-6-foreground = #fab387
ramp-load-7 = 
ramp-load-7-foreground = #fab387
ramp-load-8 = 
ramp-load-8-foreground = ${colors.alert}
ramp-load-9 = 
ramp-load-9-foreground = ${colors.alert}


[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = "disc "
label-disconnected-foreground = ${colors.disabled}


[module/wlan]
inherit = network-base
interface-type = wireless
; Signal icon (like the battery) and the network name, cut to 12 characters;
; a left click shows the full name, signal and IP (bin/net-info)
format-connected = %{A1:~/.local/bin/net-info:}<ramp-signal> <label-connected>%{A}
format-disconnected = %{A1:~/.local/bin/net-info:}<label-disconnected>%{A}
label-connected = "%essid:0:12:…% "
label-disconnected = "󰤭 offline "
ramp-signal-0 = 󰤯
ramp-signal-0-foreground = ${colors.alert}
ramp-signal-1 = 󰤟
ramp-signal-1-foreground = #fab387
ramp-signal-2 = 󰤢
ramp-signal-2-foreground = ${colors.primary}
ramp-signal-3 = 󰤥
ramp-signal-3-foreground = ${colors.primary}
ramp-signal-4 = 󰤨
ramp-signal-4-foreground = ${colors.primary}


[module/eth]
inherit = network-base
interface-type = wired
; Only shown while a cable is connected
label-connected = "󰈀 "
label-connected-foreground = ${colors.primary}
format-disconnected =


[module/battery]
; Level icon in 10% steps, percentage and time left, e.g. "18%|1h1m"; a plug
; icon while plugged in but not charging (charge threshold). See
; ~/.local/bin/battery-status: polybar's internal module treats "Not charging"
; as discharging and would show a meaningless time.
type = custom/script
exec = ~/.local/bin/battery-status
interval = 5
label = "%output% "


[module/date]
type = internal/date
interval = 1
date = %a %d-%m-%Y %H:%M:%S
; Leading space for looks next to the systray; a click toggles the calendar
format = %{A1:~/.local/bin/calendar-toggle:}<label>%{A}
label = " %date%"
label-foreground = ${colors.accent}


[module/caffeine]
type = custom/script
exec = ~/.config/polybar/scripts/caffeine_status.sh
interval = 1
click-left = ~/.config/polybar/scripts/caffeine_toggle.sh
format-prefix = "󰅶 "

;==========================================================
;   SETTINGS
;==========================================================

[settings]
; xmonad relaunches the bars when monitors are (dis)connected
screenchange-reload = false
pseudo-transparency = true

; vim:ft=dosini
