;==========================================================
;   Polybar config — Catppuccin Mocha (COMPACT + SEPARATOR)
;==========================================================

[colors]
background = #1e1e2e
background-alt = #313244
foreground = #cdd6f4

; Primary is Green (Mocha Green)
primary = #a6e3a1
secondary = #94e2d5

; Pink color (used for the border and accents)
accent = #f5c2e7

alert = #f38ba8
disabled = #6c7086


;==========================================================
;   BAR MAIN (VGA-1) -> MONITOR 0
;==========================================================

[bar/main]
monitor = ${env:MONITOR}
bottom = true
width = 100%
height = 24pt

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3

; --- BORDER CONFIGURATION ---
border-size = 0
border-top-size = 3
border-top-color = ${colors.accent}
; ----------------------------

padding-left = 0
padding-right = 0
padding-top = 0
padding-bottom = 0

; Keep margins at 0 so there are no big empty gaps
module-margin-left = 0
module-margin-right = 0

; --- RESTORED: the vertical separator ---
separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=11;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=11;2"

modules-left = xmonad
modules-right = filesystem pulseaudio caffeine xkeyboard memory cpu battery wlan eth systray date 

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true



;==========================================================
;   BAR SECOND (DVI-D-1) -> MONITOR 1
;==========================================================

[bar/secondary]
monitor = ${env:MONITOR}
bottom = true
width = 100%
height = 24pt

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3

; --- BORDER CONFIGURATION ---
border-size = 0
border-top-size = 3
border-top-color = ${colors.accent}
; ----------------------------

padding-left = 0
padding-right = 0
padding-top = 0
padding-bottom = 0

; Keep margins at 0
module-margin-left = 0
module-margin-right = 0

; --- RESTORED: the vertical separator ---
separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=11;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=11;2"

modules-left = xmonad
modules-right = filesystem pulseaudio caffeine xkeyboard memory cpu battery wlan eth date

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true


;==========================================================
;   BAR TERTIARY (HDMI-1) -> MONITOR 2
;==========================================================

[bar/tertiary]
monitor = ${env:MONITOR}
bottom = true
width = 100%
height = 24pt

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3

; --- BORDER CONFIGURATION ---
border-size = 0
border-top-size = 3
border-top-color = ${colors.accent}
; ----------------------------

padding-left = 0
padding-right = 0
padding-top = 0
padding-bottom = 0

; Keep margins at 0
module-margin-left = 0
module-margin-right = 0

; --- RESTORED: the vertical separator ---
separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=11;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=11;2"

modules-left = xmonad
modules-right = filesystem pulseaudio caffeine xkeyboard memory cpu battery wlan eth date

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true


;==========================================================
;   MODULES
;==========================================================

[module/systray]
type = internal/tray
tray-spacing = 4pt
tray-maxsize = 18

; --- XMONAD: active monitor, workspaces, layout and window ---
; xmonad publishes each screen's text; SCREEN is set by launch-bars.sh
[module/xmonad]
type = custom/script
exec = ~/.config/polybar/xmonad-log.sh ${env:SCREEN:0}
tail = true
format = <label>
label = %output%

; -----------------------------------------


[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
label-mounted = %mountpoint% %percentage_used%%
label-mounted-foreground = ${colors.primary}
label-unmounted = not mounted
label-unmounted-foreground = ${colors.disabled}


[module/pulseaudio]
type = internal/pulseaudio

click-right = pavucontrol
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%

label-muted = "muted "
label-muted-foreground = ${colors.disabled}


[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = "%layout% "
label-layout-foreground = ${colors.primary}

; --- SPECIFIC CAPS LOCK CONFIGURATION ---
label-indicator-on-capslock = "󰘲 󰪛"
label-indicator-on-capslock-background = ${colors.secondary}
label-indicator-on-capslock-foreground = ${colors.background}
label-indicator-on-capslock-padding = 1
label-indicator-on-capslock-margin = 0

[module/memory]
type = internal/memory
interval = 2
; Same icon, Catppuccin colour by usage: green < 60%, peach 60-79%, red >= 80%
format = <ramp-used> <label>
label = %percentage_used:2%%
module-margin-left = 0
module-margin-right = 0
module-padding-right = 0
ramp-used-0 = 
ramp-used-0-foreground = ${colors.primary}
ramp-used-1 = 
ramp-used-1-foreground = ${colors.primary}
ramp-used-2 = 
ramp-used-2-foreground = ${colors.primary}
ramp-used-3 = 
ramp-used-3-foreground = ${colors.primary}
ramp-used-4 = 
ramp-used-4-foreground = ${colors.primary}
ramp-used-5 = 
ramp-used-5-foreground = ${colors.primary}
ramp-used-6 = 
ramp-used-6-foreground = #fab387
ramp-used-7 = 
ramp-used-7-foreground = #fab387
ramp-used-8 = 
ramp-used-8-foreground = ${colors.alert}
ramp-used-9 = 
ramp-used-9-foreground = ${colors.alert}


[module/cpu]
type = internal/cpu
interval = 2
; Same icon, Catppuccin colour by load: green < 50%, peach 50-79%, red >= 80%
format = <ramp-load> <label>
label = %percentage:2%%
ramp-load-0 = 
ramp-load-0-foreground = ${colors.primary}
ramp-load-1 = 
ramp-load-1-foreground = ${colors.primary}
ramp-load-2 = 
ramp-load-2-foreground = ${colors.primary}
ramp-load-3 = 
ramp-load-3-foreground = ${colors.primary}
ramp-load-4 = 
ramp-load-4-foreground = ${colors.primary}
ramp-load-5 = 
ramp-load-5-foreground = #fab387
ramp-load-6 = 
ramp-load-6-foreground = #fab387
ramp-load-7 = 
ramp-load-7-foreground = #fab387
ramp-load-8 = 
ramp-load-8-foreground = ${colors.alert}
ramp-load-9 = 
ramp-load-9-foreground = ${colors.alert}


[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = "disc "
label-disconnected-foreground = ${colors.disabled}


[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = "%ifname% %essid% "
label-connected-foreground = ${colors.primary}


[module/eth]
inherit = network-base
interface-type = wired
label-connected = "%ifname% "
label-connected-foreground = ${colors.primary}


[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99

; Battery icon by level in steps of 10% (30-39% shows the 30% icon),
; red when low, with a bolt in front while charging. The percentage stays.
format-discharging = <ramp-capacity> <label-discharging>
format-charging = %{F#a6e3a1}󱐋%{F-}<ramp-capacity> <label-charging>
format-full = <ramp-capacity> <label-full>
label-charging = "%percentage%% "
label-discharging = "%percentage%% "
label-full = "%percentage%% "

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂
ramp-capacity-10 = 󰁹
ramp-capacity-foreground = ${colors.primary}
ramp-capacity-0-foreground = ${colors.alert}
ramp-capacity-1-foreground = ${colors.alert}
ramp-capacity-2-foreground = ${colors.alert}
ramp-capacity-3-foreground = #fab387


[module/date]
type = internal/date
interval = 1
date = %a %d-%m-%Y %H:%M:%S
date-alt = %H:%M
; Leading space for looks next to the systray
label = " %date%"
label-foreground = ${colors.accent}


[module/caffeine]
type = custom/script
exec = ~/.config/polybar/scripts/caffeine_status.sh
interval = 1
click-left = ~/.config/polybar/scripts/caffeine_toggle.sh
format-prefix = "󰅶 "

;==========================================================
;   SETTINGS
;==========================================================

[settings]
; xmonad relaunches the bars when monitors are (dis)connected
screenchange-reload = false
pseudo-transparency = true

; vim:ft=dosini
