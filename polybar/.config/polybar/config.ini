;==========================================================
;   Polybar config — Catppuccin Mocha (COMPACT + SEPARATOR)
;==========================================================

[colors]
background = #1e1e2e
background-alt = #313244
foreground = #cdd6f4

; Primary is Green (Mocha Green)
primary = #a6e3a1
secondary = #94e2d5

; Pink color (used for the border and accents)
accent = #f5c2e7

alert = #f38ba8
disabled = #6c7086


;==========================================================
;   BAR MAIN (VGA-1) -> MONITOR 0
;==========================================================

[bar/main]
monitor = VGA-1
bottom = true
width = 100%
height = 24pt

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3

; --- BORDER CONFIGURATION ---
border-size = 0
border-top-size = 3
border-top-color = ${colors.accent}
; ----------------------------

padding-left = 0
padding-right = 0
padding-top = 0
padding-bottom = 0

; Mantenemos los margenes en 0 para que no haya huecos vacíos grandes
module-margin-left = 0
module-margin-right = 0

; --- RESTAURADO: El separador vertical ---
separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=11;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=11;2"

modules-left = xmonad-workspaces-0 xwindow-0
modules-right = filesystem pulseaudio caffeine xkeyboard memory cpu wlan eth systray date 

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true


;==========================================================
;   BAR SECOND (DVI-D-1) -> MONITOR 1
;==========================================================

[bar/second]
monitor = HDMI-1
bottom = true
width = 100%
height = 24pt

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3

; --- BORDER CONFIGURATION ---
border-size = 0
border-top-size = 3
border-top-color = ${colors.accent}
; ----------------------------

padding-left = 0
padding-right = 0
padding-top = 0
padding-bottom = 0

; Mantenemos los margenes en 0
module-margin-left = 0
module-margin-right = 0

; --- RESTAURADO: El separador vertical ---
separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=11;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=11;2"

modules-left = xmonad-workspaces-1 xwindow-1
modules-right = filesystem pulseaudio caffeine xkeyboard memory cpu wlan eth date

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true


;==========================================================
;   MODULES
;==========================================================

[module/systray]
type = internal/tray
tray-spacing = 4pt
tray-maxsize = 18

; --- MODULE FOR MONITOR 0 (Primary) ---
[module/xmonad-workspaces-0]
type = custom/script
exec = ~/.config/polybar/xmonad-layout.sh 0
tail = true
format = <label>
enable-ipc = true
label = %output%
label-active-padding = 0
label-occupied-padding = 0
label-urgent-padding = 0
label-empty-padding = 0
module-margin-left = 0
module-margin-right = 0


; --- MODULE FOR MONITOR 1 (Secondary) ---
[module/xmonad-workspaces-1]
type = custom/script
exec = ~/.config/polybar/xmonad-layout.sh 1
tail = true
format = <label>
enable-ipc = true
label = %output%
label-active-padding = 0
label-occupied-padding = 0
label-urgent-padding = 0
label-empty-padding = 0

; -----------------------------------------


[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
label-mounted = %mountpoint% %percentage_used%%
label-mounted-foreground = ${colors.primary}
label-unmounted = not mounted
label-unmounted-foreground = ${colors.disabled}


[module/pulseaudio]
type = internal/pulseaudio

click-right = pavucontrol
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%

label-muted = "muted "
label-muted-foreground = ${colors.disabled}


[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = "%layout% "
label-layout-foreground = ${colors.primary}

; --- SPECIFIC CAPS LOCK CONFIGURATION ---
label-indicator-on-capslock = "󰘲 󰪛"
label-indicator-on-capslock-background = ${colors.secondary}
label-indicator-on-capslock-foreground = ${colors.background}
label-indicator-on-capslock-padding = 1
label-indicator-on-capslock-margin = 0

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%
module-margin-left = 0
module-margin-right = 0
module-padding-right = 0


[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%


[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = "disc "
label-disconnected-foreground = ${colors.disabled}


[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = "%ifname% %essid% "
label-connected-foreground = ${colors.primary}


[module/eth]
inherit = network-base
interface-type = wired
label-connected = "%ifname% "
label-connected-foreground = ${colors.primary}


[module/date]
type = internal/date
interval = 1
date = %a %d-%m-%Y %H:%M:%S
date-alt = %H:%M
; Añadido un espacio al inicio por estética cerca del systray
label = " %date%"
label-foreground = ${colors.accent}


[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-empty =

[module/xwindow-0]
type = custom/script
exec = ~/.config/polybar/xmonad-window.sh 1
tail = true

[module/xwindow-1]
type = custom/script
exec = ~/.config/polybar/xmonad-window.sh 0
tail = true

[module/caffeine]
type = custom/script
exec = ~/.config/qtile/scripts/caffeine_status.sh
interval = 1
click-left = ~/.config/qtile/scripts/caffeine_toggle.sh
format-prefix = "󰅶 "

;==========================================================
;   SETTINGS
;==========================================================

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini