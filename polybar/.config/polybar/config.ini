;==========================================================
;   Polybar config — Catppuccin Mocha (COMPACT + SEPARATOR)
;==========================================================

[colors]
background = #1e1e2e
background-alt = #313244
foreground = #cdd6f4

; Primary is Green (Mocha Green)
primary = #a6e3a1
secondary = #94e2d5

; Pink color (used for the border and accents)
accent = #f5c2e7

alert = #f38ba8
disabled = #6c7086


;==========================================================
;   BAR MAIN (VGA-1) -> MONITOR 0
;==========================================================

[bar/main]
monitor = ${env:MONITOR}
bottom = true
; Floating pill: margin around the bar and fully round ends (radius = half the height).
; Polybar paints the shape itself, so it works with or without picom.
width = 100%:-24
height = 24pt
offset-x = 12
offset-y = 8
radius = 16

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3

; --- BORDER CONFIGURATION ---
border-size = 2
border-color = ${colors.accent}
; ----------------------------

padding-left = 2
padding-right = 2
padding-top = 0
padding-bottom = 0

; Keep margins at 0 so there are no big empty gaps
module-margin-left = 0
module-margin-right = 0

; --- RESTORED: the vertical separator ---
separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=11;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=11;2"

modules-left = xmonad
modules-right = filesystem pulseaudio caffeine xkeyboard memory cpu battery wlan eth systray date 

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true



