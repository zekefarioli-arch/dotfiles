; ----------------------------

padding-left = 2
padding-right = 2
padding-top = 0
padding-bottom = 0

; Keep margins at 0
module-margin-left = 0
module-margin-right = 0

; --- RESTORED: the vertical separator ---
separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=11;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=11;2"

modules-left = xmonad
modules-right = filesystem pulseaudio caffeine xkeyboard memory cpu battery wlan eth date

