# ~/.config/picom/picom.conf — compositor, started by ~/.xmonad/autostart.sh

backend = "glx";
vsync = true;

# Blur only the dropdown terminal (Super+Ctrl+T), which is slightly
# transparent: what runs behind it shows through softly. Other windows
# are untouched, so there is no extra cost the rest of the time.
blur: {
  method = "dual_kawase";
  strength = 5;
};

# The dropdown slides down from the top when it appears, and fades out in
# place when it hides (xmonad unmaps it).
rules = (
  {
    match = "class_g = 'dropterm'";
    blur-background = true;
    animations = (
      { triggers = ["open", "show"]; preset = "slide-in"; direction = "up"; duration = 0.2; },
      # Hiding: it fades out in place, with the blur fading too
      {
        triggers = ["close", "hide"];
        opacity = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.2; start = "window-raw-opacity-before"; end = 0; };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";
      }
    );
  }
);
