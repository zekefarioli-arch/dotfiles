# ~/.config/picom/picom.conf — compositor, started by ~/.xmonad/autostart.sh

backend = "glx";
vsync = true;

# Rounded windows. Not rounded: the bar (a dock, polybar draws its own pill),
# fullscreen windows and the screenshot selector.
corner-radius = 14;

# Blur only the dropdown terminal (Super+Ctrl+T), which is slightly
# transparent: what runs behind it shows through softly. Other windows
# are untouched, so there is no extra cost the rest of the time.
blur: {
  method = "dual_kawase";
  strength = 5;
};

# The dropdown slides down from the top when it appears and retracts back
# up when it hides (xmonad unmaps it).
rules = (
  { match = "window_type = 'dock' || window_type = 'desktop' || fullscreen || class_g = 'slop'"; corner-radius = 0; },
  # Blur is opt-in: only the dropdown terminal (rule below) gets it. Without a
  # catch-all picom blurs whatever is behind ANY translucent window, including
  # the transparent margin where GTK and Brave draw their popup shadows: menus
  # showed a square, lighter, blurred box around them.
  { match = "class_g != 'dropterm'"; blur-background = false; },
  # The area selector of `screenshot` (maim/slop) is a translucent window over
  # the whole screen; without this rule picom blurs the entire screen while
  # selecting.
  { match = "class_g = 'slop'"; blur-background = false; },
  {
    match = "class_g = 'dropterm'";
    blur-background = true;
    animations = (
      { triggers = ["open", "show"]; preset = "slide-in"; direction = "up"; duration = 0.35; },
      # Hiding: the opposite of showing, it retracts up out of the screen,
      # a bit slower; the blur fades as it goes so it does not stay behind
      {
        triggers = ["close", "hide"];
        # Keep the window visible while it moves (hidden windows default to opacity 0)
        opacity = { curve = "linear"; duration = 0.45; start = "window-raw-opacity-before"; end = "window-raw-opacity-before"; };
        offset-y = { curve = "cubic-bezier(0.4, 0, 1, 1)"; duration = 0.45; start = 0; end = "- window-height"; };
        blur-opacity = { curve = "linear"; duration = 0.45; start = 1; end = 0; };
        shadow-opacity = "blur-opacity";
      }
    );
  }
);
