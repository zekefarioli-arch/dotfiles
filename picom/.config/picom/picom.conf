# ~/.config/picom/picom.conf — compositor, started by ~/.xmonad/autostart.sh

backend = "glx";
vsync = true;

# Blur only the dropdown terminal (Super+Ctrl+T), which is slightly
# transparent: what runs behind it shows through softly. Other windows
# are untouched, so there is no extra cost the rest of the time.
blur: {
  method = "dual_kawase";
  strength = 5;
};

rules = (
  { match = "class_g = 'dropterm'"; blur-background = true; }
);
